[project]
name = "data-analysis-visualization"
version = "0.1.0"
description = "Data analysis and visualization using Python and Taipy"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pandas (>=3.1.1,<4.0.0)", "pyarrow (>=26.0.1,<27.0.0)"]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

